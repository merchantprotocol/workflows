      subtype: chat-app
      category: trigger
      label: Trigger
      config:
        triggerType: chat-app
        triggerDescription: Receives domain and log path from parent workflow orchestrator
  - id: node-2000000000002
    type: workflow
    position:
      x: 496.76738882554173
      y: 360.34435575826683
    data:
      subtype: agent
      category: agent
      label: Observe
      config:
        agentId: observer
        agentName: Observer
        additionalPrompt: ""
        orchestratorInstructions: >
          The trigger message tells you the domain to observe and the log path.

          **Step 1:** Determine the domain (human, business, world, or agent) from the trigger message.

          **Step 2:** Load the corresponding observe skill using the load_skill tool — for example
          if the domain is "human", load the skill "observe-human". If the domain is "agent", load
          the skill "observe-agent".

          **Step 3:** Read the skill's topics and instructions. Create a <PROMPT> tag for each
          observation topic defined in the skill. Each observer sub-agent should write its own
          log file at the log path specified in the trigger message.

          Do NOT stop after loading the skill. You MUST proceed to dispatch all observation topics
          as sub-agents and wait for them to complete.
        successCriteria: All observation topics from the skill have been dispatched and completed
        completionContract: Exit when all observer agents have written their log files
