id: workflow-observe
name: Observe
description: Universal observation workflow — loads domain-specific observe skill and delegates to parallel observer agents
version: 2
createdAt: 2026-03-18T04:00:00.000Z
updatedAt: 2026-03-19T20:00:00.000Z
nodes:
  - id: node-2000000000001
    type: workflow
    position:
      x: 496.7673888255416
      y: 77.80045610034206
    data:
      subtype: chat-app
      category: trigger
      label: Trigger
      config:
        triggerType: chat-app
        triggerDescription: Receives domain and log path from parent workflow orchestrator
  - id: node-2000000000010
    type: workflow
    position:
      x: 496.12086659064994
      y: 206.24743443557583
    data:
      subtype: orchestrator-prompt
      category: agent
      label: Load Skill
      config:
        prompt: |
          The trigger message tells you the domain to observe and the log path.
          Determine the domain (human, business, world, or agent) from the trigger message.
          Load the corresponding observe skill — for example if the domain is "human",
          load the skill "observe-human". If the domain is "agent", load the skill "observe-agent".
          Load the skill and wait for further instructions.
  - id: node-2000000000002
    type: workflow
    position:
      x: 496.76738882554173
      y: 360.34435575826683
    data:
      subtype: agent
      category: agent
      label: Observe
      config:
        agentId: observer
        agentName: Observer
        additionalPrompt: ""
        orchestratorInstructions: |
          The observe skill has been loaded. You now have access to the skill's topics
          and instructions in your context.

          Use the skill's observation topics to guide your work. For each topic defined
          in the skill, create a <PROMPT> tag to dispatch a sub-agent that will observe
          that specific topic and write its own log file at the log path from the trigger
          message.

          Do NOT do all the observation work yourself. Dispatch sub-agents for each topic
          so they run in parallel.
        successCriteria: All observation topics from the skill have been dispatched and completed
        completionContract: Exit when all observer agents have written their log files
  - id: node-2000000000003
    type: workflow
    position:
      x: 496.30406210108924
      y: 507.8455992302411
    data:
      subtype: response
      category: io
      label: Done
      config:
        responseTemplate: Observation complete for the requested domain.
