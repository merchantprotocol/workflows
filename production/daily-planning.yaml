      label: Observe Human
      config:
        workflowId: workflow-observe
        awaitResponse: true
        agentId: Observer
        orchestratorPrompt: Run the observe workflow for the human domain. FIRST read the real-time observation log at ~/sulla/daily-logs/{{YYYY-MM-DD}}/observations.md — these are observations collected throughout the day during live conversations. Use them as a starting point and supplement with your own deep observation. Write observation logs to ~/sulla/daily-logs/{{YYYY-MM-DD}}/human/
