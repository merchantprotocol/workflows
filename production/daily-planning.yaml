      label: Think Human
      config:
        workflowId: workflow-thinker
        awaitResponse: true
        agentId: Thinker
        orchestratorPrompt: This thinking process needs to be done on the human observation logs. We wanna make sure that we're very specific about what logs that we look at in order to create this identity file so pass the path as a GLOB for all of the human log files.
