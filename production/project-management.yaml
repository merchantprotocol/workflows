          ***

          ## Next Technical Action Plan

          **Task Title:** Implement PostgreSQL Database Schema for Unified Messaging System

          **Why this task is next:** The PRD is complete and Phase 1 (Infrastructure) can begin immediately. Database schema creation does not require any API credentials — it's the foundational layer all platform integrations will depend on. This unblocks the next phase of development.

          **Objective:** Create and deploy the PostgreSQL schema defined in the PRD, including tables for conversations, messages, platform accounts, message routing rules, and audit logs. Set up indexes for performance and create initial seed data for testing.

          **Detailed Technical Steps:**

          1. **Review PRD Schema Design**: Read the unified-messaging-system PRD at `/Users/jonathonbyrdziak/sulla/projects/unified-messaging-system/PROJECT.md` section "Architecture → Database Schema" to confirm table structures, relationships, and field definitions.

          2. **Create Migration File**: Write a SQL migration script at `/Users/jonathonbyrdziak/sulla/projects/unified-messaging-system/db/migrations/001_initial_schema.sql` containing:
             - `platform_accounts` table (id, platform_type, account_id, access_token, refresh_token, expires_at, metadata, created_at, updated_at)
             - `conversations` table (id, uuid, primary_platform_account_id, status, metadata, created_at, updated_at)
             - `conversation_mappings` table (id, conversation_id, platform_type, platform_conversation_id, platform_account_id, is_primary, created_at)
             - `messages` table (id, conversation_id, platform_type, platform_message_id, direction, content, metadata, status, created_at, delivered_at)
             - `message_routing_rules` table (id, name, condition_type, condition_value, action_type, action_value, priority, is_active, created_at)
             - `audit_logs` table (id, entity_type, entity_id, action, old_value, new_value, created_at)
             - Foreign key constraints and indexes on frequently queried columns (platform_message_id, conversation_id, created_at)

          3. **Create Index Strategy**: Add indexes for query performance:
             - `messages(conversation_id, created_at)` for conversation history queries
             - `messages(platform_type, platform_message_id)` for deduplication lookups
             - `conversation_mappings(platform_type, platform_conversation_id)` for cross-platform mapping
             - `platform_accounts(platform_type, account_id)` for account lookups

          4. **Create Seed Data Script**: Write `/Users/jonathonbyrdziak/sulla/projects/unified-messaging-system/db/seeds/test_data.sql` with sample:
             - 2 test platform accounts (one Instagram, one Email)
             - 1 test conversation with cross-platform mappings
             - 3-5 test messages showing threading and direction
             - 2 routing rules for testing

          5. **Execute Migration**: Run migration against PostgreSQL database using `psql` or Prisma migrations, verify table creation and constraint enforcement.

          6. **Validate Schema**: Run test queries to confirm:
             - Foreign key relationships work correctly
             - Indexes are created
             - Sample data inserts successfully
             - Query performance is acceptable on initial test queries

          **Required Inputs / Artifacts:**
          - PROJECT.md from `/Users/jonathonbyrdziak/sulla/projects/unified-messaging-system/`
          - PostgreSQL connection credentials (should be available in existing environment)
          - Database schema design from PRD Architecture section

          **Expected Deliverables:**
          - `/Users/jonathonbyrdziak/sulla/projects/unified-messaging-system/db/migrations/001_initial_schema.sql`
          - `/Users/jonathonbyrdziak/sulla/projects/unified-messaging-system/db/seeds/test_data.sql`
          - Executed migration with all tables created in PostgreSQL
          - Validation test results confirming schema integrity

          **Definition of Done:**

          * All 6 tables created in PostgreSQL with correct columns, types, and constraints

          * All foreign key relationships properly defined and enforced

          * Performance indexes created on high-query columns

          * Seed data successfully inserted and queryable

          * Schema validated with test queries confirming data integrity and relationships work

          ***
