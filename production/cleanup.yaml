id: workflow-cleanup
name: Daily Cleanup
description: Reviews the sulla directory for stale files and temporary artifacts — soft-deletes everything to archive first, only permanently removes from archive after 30+ days. Appends to a persistent changelog so every action is traceable.
version: 2
createdAt: 2026-03-18T18:00:00.000Z
updatedAt: 2026-03-18T19:00:00.000Z
nodes:
  - id: node-cleanup-trigger
    type: workflow
    position:
      x: 400
      y: 0
    data:
      subtype: chat-app
      category: trigger
      label: Trigger
      config:
        triggerType: chat-app
        triggerDescription: Triggered at the end of the daily planning pipeline or manually
  - id: node-cleanup-scan
    type: workflow
    position:
      x: 400
      y: 150
    data:
      subtype: agent
      category: agent
      label: Scan & Classify Files
      config:
        agentId: observer
        agentName: File Scanner
        additionalPrompt: ""
        orchestratorInstructions: >
          Scan the ~/sulla/ directory and classify files for cleanup. The agent should use exec
          with find/stat commands to build a complete inventory. Delegate to parallel workers
          using <PROMPT> tags — one per major subdirectory.

          Each worker should report files with: path, size, created date, modified date, owner
          (agent-created vs human-created), and a keep/archive recommendation with reasoning.

          **Directories to scan:**
          - ~/sulla/daily-logs/ — observation logs, thinking outputs, prompt logs
          - ~/sulla/projects/ — agent-created project workspaces
          - ~/sulla/archive/ — previously archived files (check age for permanent deletion)
          - ~/sulla/identity/ — identity files and journals (NEVER touch these)

          **Classification rules — everything is archive-first, never direct delete:**
          - daily-logs older than 14 days → archive
          - Empty or near-empty files (< 100 bytes) that are older than 3 days → archive
          - Project files with no modifications in 30+ days → archive
          - Temporary/scratch files (tmp, .bak, .old) older than 3 days → archive
          - Files in ~/sulla/archive/ older than 30 days → permanent delete candidate
          - Identity files and journals → ALWAYS keep (never touch, never archive)
          - Today's files and anything < 7 days old → keep
          - Files currently referenced by active goals → keep

          **Important:** Read the goal journals at ~/sulla/identity/human-journal.md,
          business-journal.md, and agent-journal.md (if they exist) to understand which
          projects and logs are still relevant to active work.

          Output a structured JSON report of all files with their classifications.
        successCriteria: A complete file inventory with keep/archive/purge classifications
        completionContract: Exit when the full scan report is ready
  - id: node-cleanup-review
    type: workflow
    position:
      x: 400
      y: 350
    data:
      subtype: orchestrator-prompt
      category: agent
      label: Review & Approve Plan
      config:
        prompt: >
          Review the file scan results from the previous step. Create a cleanup execution plan.
          Be conservative — when in doubt, keep the file.

          **Hard rules (never violate):**
          - NEVER touch anything in ~/sulla/identity/
          - NEVER archive today's daily-logs or anything less than 7 days old
          - NEVER archive files referenced by active goals or active projects
          - ALL removals from live directories are soft-deletes (move to ~/sulla/archive/)
          - Only permanently delete files that have been sitting in ~/sulla/archive/ for 30+ days
          - Preserve relative directory structure when archiving (e.g., daily-logs/2026-03-01/human/ → archive/daily-logs/2026-03-01/human/)

          Produce two lists:
          1. **Archive list** — files to soft-delete (move from live to ~/sulla/archive/)
          2. **Purge list** — files already in ~/sulla/archive/ for 30+ days, safe to permanently remove

          If nothing needs cleanup, say so and skip execution.
  - id: node-cleanup-execute
    type: workflow
    position:
      x: 400
      y: 500
    data:
      subtype: agent
      category: agent
      label: Execute Cleanup
      config:
        agentId: observer
        agentName: Cleanup Executor
        additionalPrompt: ""
        orchestratorInstructions: >
          Execute the cleanup plan from the previous step. The agent should:

          1. Create the archive directory preserving structure: mkdir -p ~/sulla/archive/{relative-path}/
          2. Move archive-list files into ~/sulla/archive/, preserving their relative path from ~/sulla/
          3. Permanently delete purge-list files (only files already in archive for 30+ days)
          4. Track every single action for the changelog

          If the review step said nothing needs cleanup, do nothing and exit.

          **Safety:** If in doubt about ANY file, archive it instead of purging. We can always
          recover from archive. We cannot recover from a permanent delete.

          Return a structured summary of all actions taken: files archived (with source → dest paths),
          files purged, files skipped, and any errors encountered.
        successCriteria: All cleanup actions executed successfully
        completionContract: Exit when cleanup is complete and action summary is ready
  - id: node-cleanup-changelog
    type: workflow
    position:
      x: 400
      y: 650
    data:
      subtype: orchestrator-prompt
      category: agent
      label: Append to Changelog
      config:
        prompt: >
          Append a new entry to the persistent cleanup changelog at ~/sulla/archive/CHANGELOG.md.
          This file is the permanent history of all cleanup operations. Create it if it doesn't exist.

          **Format for each entry (append, never overwrite):**

          ```
          ## YYYY-MM-DD HH:MM — Daily Cleanup

          **Archived** (soft-deleted from live → archive):
          - `{source-path}` → `{archive-path}` ({size}, {age} days old, reason: {why})
          - ...

          **Purged** (permanently removed from archive):
          - `{path}` ({size}, archived {N} days ago, reason: aged out)
          - ...

          **Kept** (reviewed but retained):
          - {count} files kept in live directories
          - {count} files kept in archive (not yet 30 days)

          **Stats:** Scanned {N} files, archived {N}, purged {N}, kept {N}
          **Disk freed:** {size}

          ---
          ```

          Also write a brief summary to today's daily log at
          ~/sulla/daily-logs/$(date +%Y-%m-%d)/cleanup-log.md.

          If nothing was cleaned up, still log an entry saying "No cleanup needed" with the scan count.
  - id: node-cleanup-done
    type: workflow
    position:
      x: 400
      y: 800
    data:
      subtype: response
      category: io
      label: Done
      config:
        responseTemplate: Daily cleanup complete.
edges:
  - id: e-cleanup-trigger-scan
    source: node-cleanup-trigger
    target: node-cleanup-scan
    animated: true
  - id: e-cleanup-scan-review
    source: node-cleanup-scan
    target: node-cleanup-review
    animated: true
  - id: e-cleanup-review-execute
    source: node-cleanup-review
    target: node-cleanup-execute
    animated: true
  - id: e-cleanup-execute-changelog
    source: node-cleanup-execute
    target: node-cleanup-changelog
    animated: true
  - id: e-cleanup-changelog-done
    source: node-cleanup-changelog
    target: node-cleanup-done
    animated: true
_status: production
viewport:
  x: 0
  y: 0
  zoom: 1
