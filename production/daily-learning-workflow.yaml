id: workflow-1741000000001
name: Daily Learning Workflow
slug: daily-learning-workflow
description: Nightly workflow that reviews conversation history, extracts learnings, identifies improvements, IMPLEMENTS fixes, and updates the learning repository
version: 1
enabled: true
createdAt: "2026-03-16T01:00:00.000Z"
updatedAt: "2026-03-16T01:43:00.000Z"
tags:
  - learning
  - nightly
  - self-improvement
pattern: linear-with-branching
nodes:
  # Trigger: Schedule-based nightly run
  - id: trigger
    type: workflow
    position:
      x: 400
      y: 100
    data:
      subtype: heartbeat
      category: trigger
      label: Nightly Schedule Trigger
      config:
        triggerType: heartbeat
        triggerDescription: "Nightly learning extraction at 4am PT"
        cron: "0 4 * * *"
        timezone: America/Los_Angeles

  # Phase 1: Project Setup
  - id: create_daily_project
    type: workflow
    position:
      x: 400
      y: 250
    data:
      subtype: agent
      category: agent
      label: Daily Project Creator
      config:
        agentId: null
        agentName: Daily Project Creator
        beforePrompt: You are a project setup agent that creates organized folder structures.
        additionalPrompt: |
          Create a new project for today's daily learning review.

          Project name format: daily-learning-YYYY-MM-DD

          Location: /Users/jonathonbyrdziak/sulla/projects/

          Inside the project, create these files:
          1. PROJECT.md - with frontmatter showing date, purpose (daily learning capture), and status (in-progress)
          2. daily-learnings.md - empty file with header "## Daily Learnings" and today's date
          3. prioritized-improvements.md - empty file with header "## Prioritized Improvements"
          4. implementation-suggestions.md - empty file with header "## Implementation Suggestions"
          5. implemented-changes.md - empty file with header "## Implemented Changes" and table format

          Return the absolute path to the created project folder.
        userMessage: ""
        successCriteria: Daily project folder created with all template files
        completionContract: ""

  - id: get_conversation_files
    type: workflow
    position:
      x: 400
      y: 400
    data:
      subtype: agent
      category: agent
      label: Conversation File Loader
      config:
        agentId: null
        agentName: Conversation File Loader
        beforePrompt: You are a file system agent that finds recent conversation files.
        additionalPrompt: |
          List all conversation files in /Users/jonathonbyrdziak/sulla/conversations/ that were modified in the last 24 hours.

          Focus on files with .jsonl extension.

          Return a JSON array of file paths for files modified since yesterday.

          If there are many files, prioritize the most recent ones (last 10-15 conversation threads).
        userMessage: "{{create_daily_project.result}}"
        successCriteria: JSON array of recent conversation file paths returned
        completionContract: ""

  # Router: Split based on conversation count
  - id: distribute_conversations
    type: workflow
    position:
      x: 400
      y: 550
    data:
      subtype: router
      category: routing
      label: Conversation Distributor
      config:
        classificationPrompt: "Determine if there are more than 10 conversation files to process. If more than 10, route to chunking. If 10 or fewer, route to direct extraction."
        routes:
          - id: route-chunk
            label: Chunk Conversations
            description: "More than 10 conversation files - split into chunks"
          - id: route-direct
            label: Direct Extraction
            description: "10 or fewer conversation files - process directly"

  # Chunk path
  - id: chunk_conversations
    type: workflow
    position:
      x: 200
      y: 700
    data:
      subtype: agent
      category: agent
      label: Conversation Chunker
      config:
        agentId: null
        agentName: Conversation Chunker
        beforePrompt: You are a data partitioning agent.
        additionalPrompt: |
          You have a list of conversation files from the previous step.

          Divide these into 3-4 roughly equal chunks (by file count, not size).

          For each chunk, create a simple text list of file paths.

          Return a JSON object with keys: chunk_1, chunk_2, chunk_3, chunk_4 (each containing array of file paths).
        userMessage: "{{get_conversation_files.result}}"
        successCriteria: Conversation files divided into 3-4 chunks
        completionContract: ""

  # Direct extraction path
  - id: direct_learning_extraction
    type: workflow
    position:
      x: 600
      y: 700
    data:
      subtype: agent
      category: agent
      label: Single File Learning Extractor
      config:
        agentId: null
        agentName: Single File Learning Extractor
        beforePrompt: You are a learning extraction agent. Your job is to read through conversation files and identify EVERYTHING we learned.
        additionalPrompt: |
          Read and analyze the conversation files from the previous step.

          For EACH conversation, identify and document:

          1. **Technical Learnings** - tools, APIs, bugs, workarounds, commands
          2. **Process Learnings** - automation opportunities, repetitive tasks, bottlenecks
          3. **Improvement Opportunities** - missing features, prompt tweaks, config changes
          4. **Knowledge Gaps** - research needed, documentation gaps
          5. **Successes to Replicate** - what worked well, patterns to repeat

          Output format for each learning:
          - Category: [technical|process|improvement|knowledge|success]
          - What happened: [brief description]
          - What we learned: [the insight]
          - Impact: [low|medium|high]
          - Suggestion: [how to improve the system]

          Return a JSON array of all learnings found. Be THOROUGH - don't miss anything.
        userMessage: "{{get_conversation_files.result}}"
        successCriteria: All learnings extracted from conversation files
        completionContract: ""

  # Phase 2: Parallel Learning Agents
  - id: learning_agent_1
    type: workflow
    position:
      x: 50
      y: 850
    data:
      subtype: agent
      category: agent
      label: Learning Extractor - Chunk 1
      config:
        agentId: null
        agentName: Learning Extractor - Chunk 1
        beforePrompt: You are a learning extraction agent. Your job is to read through conversation files and identify EVERYTHING we learned.
        additionalPrompt: |
          Conversation files to analyze (CHUNK 1) from previous step.

          For EACH conversation, identify and document:

          1. **Technical Learnings**
             - New tools, APIs, or systems we discovered
             - Bugs we encountered and how we solved them
             - Workarounds we developed
             - Commands or techniques that worked/didn't work

          2. **Process Learnings**
             - Steps that should be automated
             - Repetitive tasks that need a skill or workflow
             - Bottlenecks in our pipelines
             - Quality issues we caught

          3. **Improvement Opportunities**
             - What we wished worked differently
             - Missing features or capabilities
             - Prompt adjustments needed
             - Configuration changes needed

          4. **Knowledge Gaps**
             - Things we had to research or figure out
             - Documentation we needed but didn't have
             - Topics we need to learn more about

          5. **Successes to Replicate**
             - What worked really well
             - Patterns we should repeat

          Output format for each learning:
          - Category: [technical|process|improvement|knowledge|success]
          - What happened: [brief description]
          - What we learned: [the insight]
          - Impact: [low|medium|high]
          - Suggestion: [how to improve the system]

          Return a JSON array of all learnings found. Be THOROUGH - don't miss anything.
        userMessage: "{{chunk_conversations.result}}"
        successCriteria: All learnings extracted from chunk 1
        completionContract: ""

  - id: learning_agent_2
    type: workflow
    position:
      x: 200
      y: 850
    data:
      subtype: agent
      category: agent
      label: Learning Extractor - Chunk 2
      config:
        agentId: null
        agentName: Learning Extractor - Chunk 2
        beforePrompt: You are a learning extraction agent. Your job is to read through conversation files and identify EVERYTHING we learned.
        additionalPrompt: |
          Conversation files to analyze (CHUNK 2) from previous step.

          For EACH conversation, identify and document:

          1. **Technical Learnings** - tools, APIs, bugs, workarounds, commands
          2. **Process Learnings** - automation opportunities, repetitive tasks, bottlenecks
          3. **Improvement Opportunities** - missing features, prompt tweaks, config changes
          4. **Knowledge Gaps** - research needed, documentation gaps
          5. **Successes to Replicate** - what worked well, patterns to repeat

          Output format for each learning:
          - Category: [technical|process|improvement|knowledge|success]
          - What happened: [brief description]
          - What we learned: [the insight]
          - Impact: [low|medium|high]
          - Suggestion: [how to improve the system]

          Return a JSON array of all learnings found.
        userMessage: "{{chunk_conversations.result}}"
        successCriteria: All learnings extracted from chunk 2
        completionContract: ""

  - id: learning_agent_3
    type: workflow
    position:
      x: 350
      y: 850
    data:
      subtype: agent
      category: agent
      label: Learning Extractor - Chunk 3
      config:
        agentId: null
        agentName: Learning Extractor - Chunk 3
        beforePrompt: You are a learning extraction agent. Your job is to read through conversation files and identify EVERYTHING we learned.
        additionalPrompt: |
          Conversation files to analyze (CHUNK 3) from previous step.

          For EACH conversation, identify and document:

          1. **Technical Learnings** - tools, APIs, bugs, workarounds, commands
          2. **Process Learnings** - automation opportunities, repetitive tasks, bottlenecks
          3. **Improvement Opportunities** - missing features, prompt tweaks, config changes
          4. **Knowledge Gaps** - research needed, documentation gaps
          5. **Successes to Replicate** - what worked well, patterns to repeat

          Output format for each learning:
          - Category: [technical|process|improvement|knowledge|success]
          - What happened: [brief description]
          - What we learned: [the insight]
          - Impact: [low|medium|high]
          - Suggestion: [how to improve the system]

          Return a JSON array of all learnings found.
        userMessage: "{{chunk_conversations.result}}"
        successCriteria: All learnings extracted from chunk 3
        completionContract: ""

  # Merge parallel learning paths
  - id: merge_learnings
    type: workflow
    position:
      x: 400
      y: 1000
    data:
      subtype: merge
      category: flow-control
      label: Merge Learning Paths
      config:
        mergeStrategy: "last"

  # Phase 3: Aggregate & Prioritize
  - id: aggregate_learnings
    type: workflow
    position:
      x: 400
      y: 1150
    data:
      subtype: agent
      category: agent
      label: Learning Aggregator
      config:
        agentId: null
        agentName: Learning Aggregator
        beforePrompt: You are a learning aggregation agent. Combine all learnings into a single, deduplicated list.
        additionalPrompt: |
          Combine all learnings from the different chunks/sources into a single, deduplicated list.

          Steps:
          1. Combine all learnings into one list
          2. Remove exact duplicates (same category + what happened)
          3. Merge similar learnings (combine their suggestions)
          4. Sort by: impact (high first), then category

          Output: A clean JSON array of unique learnings with:
          - Original categories preserved
          - Combined suggestions
          - Final impact level

          Also provide a brief summary:
          - Total learnings found
          - Count by category
          - Count by impact level
        userMessage: "{{merge_learnings.result}}"
        successCriteria: Deduplicated and sorted learnings list produced
        completionContract: ""

  - id: prioritize_learnings
    type: workflow
    position:
      x: 400
      y: 1300
    data:
      subtype: agent
      category: agent
      label: Learning Prioritizer
      config:
        agentId: null
        agentName: Learning Prioritizer
        beforePrompt: You are a prioritization agent. Analyze consolidated learnings and rank them by implementation priority.
        additionalPrompt: |
          Prioritization Criteria:
          - Impact: high impact improvements first
          - Effort: lower effort items can be done more often
          - Frequency: learnings that apply to frequent tasks rank higher
          - Blockers: items blocking other improvements rank higher

          Create a prioritized list with:
          1. HIGH PRIORITY - items to implement this week
          2. MEDIUM PRIORITY - items to implement this month
          3. LOW PRIORITY - items to document for future consideration

          For each item, include:
          - The learning
          - Why it's ranked this way
          - Suggested implementation approach
          - Estimated effort: [low|medium|high]

          Output: A markdown-formatted prioritized list saved to the daily project folder.
        userMessage: "{{aggregate_learnings.result}}"
        successCriteria: Prioritized list with HIGH/MEDIUM/LOW categories
        completionContract: ""

  # Phase 4: System Improvement Analysis
  - id: analyze_system_improvements
    type: workflow
    position:
      x: 400
      y: 1450
    data:
      subtype: agent
      category: agent
      label: System Improvement Analyzer
      config:
        agentId: null
        agentName: System Improvement Analyzer
        beforePrompt: You are a system improvement analyst. Identify patterns and suggest system-level improvements.
        additionalPrompt: |
          Analysis Framework - examine learnings from these perspectives:

          1. **Automation Opportunities**
             - What tasks are repeated that could be automated?
             - Which skills/workflows need to be created?
             - What agents need new capabilities?

          2. **Prompt Engineering**
             - Which prompts need tweaking based on what we learned?
             - What instructions are missing?
             - What context do we keep needing to provide?

          3. **Infrastructure**
             - What tools are missing?
             - What integrations need to be added?
             - What configurations need to change?

          4. **Process Changes**
             - What steps in our workflows need modification?
             - What quality gates are missing?
             - What validation needs to be added?

          5. **Knowledge Management**
             - What documentation is missing?
             - What should be added to skills or SOPs?
             - What needs to be in the knowledge base?

          Output a JSON array of system improvement suggestions with:
          - Category: [automation|prompt|infrastructure|process|knowledge]
          - Current state: what happens now
          - Improved state: what should happen
          - Implementation suggestion: how to implement
          - Effort: [low|medium|high]
          - Impact: [low|medium|high]
        userMessage: "{{prioritize_learnings.result}}"
        successCriteria: System improvement suggestions categorized and documented
        completionContract: ""

  # Phase 5: Select Items to Implement
  - id: select_implementation_items
    type: workflow
    position:
      x: 400
      y: 1600
    data:
      subtype: agent
      category: agent
      label: Implementation Selector
      config:
        agentId: null
        agentName: Implementation Selector
        beforePrompt: You are an implementation selector. Select which improvements to implement TODAY.
        additionalPrompt: |
          SELECTION RULES:
          1. Start small - select 1-3 items MAXIMUM for today
          2. Prioritize LOW effort items first
          3. Only select HIGH impact items if effort is low
          4. Avoid items that could break existing functionality

          Today's selection criteria:
          - Effort must be LOW (things we can safely implement)
          - Impact should be MEDIUM or HIGH
          - Must be implementable in under 30 minutes

          For each selected item, provide:
          - The improvement
          - Why we're implementing it today
          - The exact files that need to change
          - The exact changes to make

          Output: A JSON array of 1-3 items to implement, with full implementation details.
        userMessage: "{{analyze_system_improvements.result}}"
        successCriteria: 1-3 implementation items selected with full details
        completionContract: ""

  # Phase 6: Implement Changes (parallel)
  - id: implement_change_1
    type: workflow
    position:
      x: 200
      y: 1750
    data:
      subtype: agent
      category: agent
      label: Implementation Agent - Change 1
      config:
        agentId: null
        agentName: Implementation Agent - Change 1
        beforePrompt: You are an implementation agent. Your job is to actually IMPLEMENT the first selected change.
        additionalPrompt: |
          Instructions:
          1. Read the current state of the file(s) specified in the implementation plan
          2. Make the exact changes specified
          3. Do NOT make any other changes
          4. Verify the change was applied correctly

          After implementing, report:
          - File(s) modified
          - Change made
          - Verification that it worked

          IMPORTANT: Only make changes that are SAFE and REVERSIBLE.
        userMessage: "{{select_implementation_items.result}}"
        successCriteria: First change implemented and verified
        completionContract: ""

  - id: implement_change_2
    type: workflow
    position:
      x: 400
      y: 1750
    data:
      subtype: agent
      category: agent
      label: Implementation Agent - Change 2
      config:
        agentId: null
        agentName: Implementation Agent - Change 2
        beforePrompt: You are an implementation agent. Your job is to actually IMPLEMENT the second selected change.
        additionalPrompt: |
          Instructions:
          1. Read the current state of the file(s) specified in the implementation plan
          2. Make the exact changes specified
          3. Do NOT make any other changes
          4. Verify the change was applied correctly

          After implementing, report:
          - File(s) modified
          - Change made
          - Verification that it worked

          IMPORTANT: Only make changes that are SAFE and REVERSIBLE.
        userMessage: "{{select_implementation_items.result}}"
        successCriteria: Second change implemented and verified
        completionContract: ""

  - id: implement_change_3
    type: workflow
    position:
      x: 600
      y: 1750
    data:
      subtype: agent
      category: agent
      label: Implementation Agent - Change 3
      config:
        agentId: null
        agentName: Implementation Agent - Change 3
        beforePrompt: You are an implementation agent. Your job is to actually IMPLEMENT the third selected change.
        additionalPrompt: |
          Instructions:
          1. Read the current state of the file(s) specified in the implementation plan
          2. Make the exact changes specified
          3. Do NOT make any other changes
          4. Verify the change was applied correctly

          After implementing, report:
          - File(s) modified
          - Change made
          - Verification that it worked

          IMPORTANT: Only make changes that are SAFE and REVERSIBLE.
        userMessage: "{{select_implementation_items.result}}"
        successCriteria: Third change implemented and verified
        completionContract: ""

  # Merge implementation paths
  - id: merge_implementations
    type: workflow
    position:
      x: 400
      y: 1900
    data:
      subtype: merge
      category: flow-control
      label: Merge Implementation Results
      config:
        mergeStrategy: "last"

  # Phase 7: Update Learning Repository
  - id: update_learning_repository
    type: workflow
    position:
      x: 400
      y: 2050
    data:
      subtype: agent
      category: agent
      label: Learning Repository Updater
      config:
        agentId: null
        agentName: Learning Repository Updater
        beforePrompt: You are a repository updater. Save today's learnings AND implemented changes to the permanent learning repository.
        additionalPrompt: |
          === FILES TO UPDATE ===

          1. **daily-learnings-{date}.md** in /sulla/projects/learnings/daily-learnings/
             - Create with all consolidated learnings

          2. **prioritized-improvements.md** in /sulla/projects/learnings/
             - Add today's new prioritized items
             - Mark items that were IMPLEMENTED TODAY with status "IMPLEMENTED"
             - Keep existing items that are still relevant

          3. **implementation-suggestions.md** in /sulla/projects/learnings/
             - Append new system improvement suggestions

          4. **changelog.md** in /sulla/projects/learnings/
             - Add entries for what was implemented TODAY
             - Format: | Date | Change | Category | Files Modified | Status |
             - This is the key file for tracking what we've done

          After updating, provide a summary of what was saved.
        userMessage: "{{merge_implementations.result}}"
        successCriteria: All learning repository files updated
        completionContract: ""

  # Phase 8: Final Report
  - id: generate_final_report
    type: workflow
    position:
      x: 400
      y: 2200
    data:
      subtype: agent
      category: agent
      label: Final Report Generator
      config:
        agentId: null
        agentName: Final Report Generator
        beforePrompt: You are a report generation agent.
        additionalPrompt: |
          Generate a final report of today's daily learning workflow.

          Include:
          1. Date of workflow run
          2. Number of conversations analyzed
          3. Total learnings extracted (by category)
          4. Top 5 prioritized improvements
          5. System improvement suggestions (by type)
          6. **WHAT WAS IMPLEMENTED TODAY** (this is the most important)
          7. Repository updates made

          Save this report to the daily project folder as workflow-report.md.
        userMessage: "{{update_learning_repository.result}}"
        successCriteria: Final report generated and saved
        completionContract: ""

  # Final Response
  - id: final_response
    type: workflow
    position:
      x: 400
      y: 2350
    data:
      subtype: response
      category: io
      label: Workflow Complete
      config:
        responseTemplate: |
          Daily Learning Workflow Complete!

          {{generate_final_report.result}}

          Resources:
          - Learning repository: ~/sulla/projects/learnings/
          - Daily project folder: See report above
        includeContext: true

