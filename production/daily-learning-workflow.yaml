config:
  max_parallel: 4
  timeout: 900
  retry_on_failure: true
  retry_count: 2

metadata:
  author: Sulla
  created: 2026-03-16
  version: "2.0.0"
  notes: Nightly learning workflow with CLOSED LOOP - extracts learnings, prioritizes, AND implements 1-3 improvements daily
