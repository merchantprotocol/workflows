id: workflow-goal-cycle
name: Goal Cycle
description: Reusable goal-setting sub-workflow — runs 7 perspective lenses in parallel, synthesizes a harmonic goal, writes to goals file, then refines through 6 independent critic rounds that each read/edit the file directly
version: 2
createdAt: 2026-03-18T06:00:00.000Z
updatedAt: 2026-03-19T23:40:00.000Z
