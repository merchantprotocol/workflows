      config:
        strategy: wait-all

  # Synthesis agent
  - id: node-3000000000021
    type: workflow
    position:
      x: 500
      y: 740
    data:
      subtype: agent
      category: agent
      label: Harmonic Synthesis
      config:
        agentId: goal-setter
        agentName: Harmonic Synthesizer
        additionalPrompt: ""
        orchestratorInstructions: "You have received 7 perspective plans from the merge. Follow all three Synthesis prompts from the goals-perspectives skill in order: (1) Find Alignment, (2) Find Conflicts, (3) The Cohesive Goal. Produce a single unified plan for this time horizon built around the cohesive goal that serves the maximum number of perspectives."
        successCriteria: A unified plan with cohesive goal, alignment map, and resolved conflicts
        completionContract: Exit when the synthesized plan is complete

  # Write goals to file BEFORE critic rounds
  - id: node-3000000000025
    type: workflow
    position:
      x: 500
      y: 880
    data:
      subtype: agent
      category: agent
      label: Write Goals to File
      config:
        agentId: goal-setter
        agentName: Goals Writer
        additionalPrompt: ""
        orchestratorInstructions: |-
          You must write the synthesized plan to the goals file. Follow these steps exactly:

          1. Determine the domain (human, business, world, or agent) from the conversation context.
          2. The goals file path is: ~/sulla/identity/{domain}/goals.md
          3. Read the current goals file using exec (it may be empty or have content from a previous horizon).
          4. Take the synthesized plan from the Harmonic Synthesis output above and format it according to the Goals Journal format for the relevant time horizon section.
          5. If the file already has content from a previous time horizon, APPEND this horizon's section — do NOT overwrite previous horizons.
          6. Write the complete file using exec.
          7. Confirm what you wrote and to which file path.
        successCriteria: Goals file written with the synthesized plan for this time horizon
        completionContract: Exit when the file is saved and confirmed

  # Critic loop — 6 rounds, each critic reads/edits the file independently
  - id: node-3000000000030
    type: workflow
    position:
      x: 500
      y: 1020
    data:
      subtype: loop
      category: flow-control
      label: Critic Rounds
      config:
        loopMode: iterations
        maxIterations: 6
        condition: ""
        conditionMode: template

  - id: node-3000000000031
    type: workflow
    position:
      x: 500
      y: 1160
    data:
      subtype: orchestrator-prompt
      category: agent
      label: Inject Critic Prompt
      config:
        prompt: |-
          You are preparing instructions for critic round {{loop.index}} (0-indexed).

          Determine the domain (human, business, world, or agent) from the conversation context.
          The goals file is at: ~/sulla/identity/{domain}/goals.md

          Based on the round number, select the correct critic methodology below and return it as the critic's instructions:

          ROUND 0 — Weakness Audit:
          Read the goals file. List the 3 biggest weaknesses in the plan. Be specific and brutal — not "could be more detailed" but "this milestone is unmeasurable because [reason]" or "this daily habit conflicts with the observed energy pattern at [time]." Then rewrite the ENTIRE goals file fixing those weaknesses and save it.

          ROUND 1 — Devil's Advocate:
          Read the goals file. Play devil's advocate against the plan. What would the strongest critic say? What assumptions is this plan making that could be dead wrong? Where is it optimistic without evidence? What external factors could derail it? Now revise the entire goals file to address those criticisms and save it.

          ROUND 2 — Expert Panel:
          Read the goals file. Imagine 3 domain experts reviewed this plan: (a) A behavioral psychologist — are the habit changes realistic given the identity's patterns? (b) A strategic planner — is the goal decomposition sound? are milestones properly sequenced? (c) Someone who knows this person well — does this plan match who they actually are, or who they wish they were? What would each expert push back on? What would they add? Now rewrite the goals file so it passes all 3 expert reviews and save it.

          ROUND 3 — Assumption Audit:
          Read the goals file. List every assumption baked into this plan. Flag which ones are weak or unverified. Specifically: assumptions about available time, energy and motivation, external factors remaining stable, skills the person may not have yet, other people's cooperation. Now rewrite the goals file with those assumptions either defended with evidence from the identity file or removed entirely, and save it.

          ROUND 4 — Quality Ratchet:
          Read the goals file. Rate this plan honestly on a scale of 1-10. What would a 10/10 version look like? What's missing? What's there that shouldn't be? What would make someone read this plan and think "this person is going to succeed"? Now write the 10/10 version of the goals file and save it.

          ROUND 5 — Coherence Check:
          Read the goals file end to end. Find any internal contradictions, vague claims, unsupported assertions, or sections that don't connect to the cohesive goal. Mark them. Also check: does the daily/weekly level actually ladder up to the 13-week arc? Does the 13-week arc actually serve the 2-year vision? Eliminate every gap, then produce the final clean version of the goals file and save it.

          Return ONLY the instructions for the round matching {{loop.index}}. Include the file path and the instruction to read the file first, apply the critique, then rewrite and save it.

  - id: node-3000000000032
    type: workflow
    position:
      x: 500
      y: 1300
    data:
      subtype: agent
      category: agent
      label: Critic
      config:
        agentId: goal-setter
        agentName: Plan Critic
        additionalPrompt: ""
        orchestratorInstructions: |-
          You are an independent goals plan critic. You have NO knowledge of what previous critics may have changed.

          Follow the critic instructions provided to you from the upstream prompt exactly:
          1. Use exec to read the goals file at the path specified.
          2. Apply your assigned critique methodology thoroughly.
          3. Rewrite the ENTIRE goals file with your improvements incorporated.
          4. Use exec to save the updated file.
          5. Confirm what you changed and why.

          Be specific, brutal, and constructive. Every change must improve the plan.
        successCriteria: Goals file rewritten with critique improvements applied
        completionContract: Exit when the updated file is saved

  # Response
  - id: node-3000000000040
    type: workflow
    position:
      x: 500
      y: 1480
    data:
      subtype: response
      category: io
      label: Refined Plan
      config:
        responseTemplate: Goal cycle complete for this time horizon. The goals file has been written and refined through 6 independent critic rounds.

