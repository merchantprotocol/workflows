id: workflow-goal-cycle
name: Goal Cycle
description: Reusable goal-setting sub-workflow — runs 7 perspective lenses in parallel, synthesizes a harmonic goal, then refines through 6 critic rounds
version: 1
createdAt: 2026-03-18T06:00:00.000Z
updatedAt: 2026-03-18T06:00:00.000Z
nodes:
  - id: node-3000000000001
    type: workflow
    position:
      x: 500
      y: 0
    data:
      subtype: chat-app
      category: trigger
      label: Trigger
      config:
        triggerType: chat-app
        triggerDescription: Receives time horizon, compressed inputs, and constraints from parent planner workflow

  - id: node-3000000000002
    type: workflow
    position:
      x: 500
      y: 120
    data:
      subtype: orchestrator-prompt
      category: agent
      label: Load Skill
      config:
        prompt: Load the goals-perspectives skill using the load_skill tool. Do NOT execute it — just load it and wait for further instructions.

  - id: node-3000000000003
    type: workflow
    position:
      x: 500
      y: 250
    data:
      subtype: parallel
      category: flow-control
      label: Launch Perspectives
      config: {}

  # 7 Perspective Lens Agents
  - id: node-3000000000010
    type: workflow
    position:
      x: 100
      y: 420
    data:
      subtype: agent
      category: agent
      label: Financial Lens
      config:
        agentId: goal-setter
        agentName: Financial Perspective
        additionalPrompt: ""
        orchestratorInstructions: "You are the Financial perspective lens. Using the identity file and think outputs provided in the trigger context, answer: If the ONLY goal were financial security and growth, what would the plan look like for the requested time horizon? Follow Lens 1 from the goals-perspectives skill. Produce a single-perspective plan."
        successCriteria: A complete single-perspective plan from the financial angle
        completionContract: Exit when the perspective plan is written

  - id: node-3000000000011
    type: workflow
    position:
      x: 250
      y: 420
    data:
      subtype: agent
      category: agent
      label: Health Lens
      config:
        agentId: goal-setter
        agentName: Health Perspective
        additionalPrompt: ""
        orchestratorInstructions: "You are the Health perspective lens. Using the identity file and think outputs provided in the trigger context, answer: If the ONLY goal were physical and mental health, what would the plan look like for the requested time horizon? Follow Lens 2 from the goals-perspectives skill. Produce a single-perspective plan."
        successCriteria: A complete single-perspective plan from the health angle
        completionContract: Exit when the perspective plan is written

  - id: node-3000000000012
    type: workflow
    position:
      x: 400
      y: 420
    data:
      subtype: agent
      category: agent
      label: Family Lens
      config:
        agentId: goal-setter
        agentName: Family Perspective
        additionalPrompt: ""
        orchestratorInstructions: "You are the Family perspective lens. Using the identity file and think outputs provided in the trigger context, answer: If the ONLY goal were family relationships and household stability, what would the plan look like for the requested time horizon? Follow Lens 3 from the goals-perspectives skill. Produce a single-perspective plan."
        successCriteria: A complete single-perspective plan from the family angle
        completionContract: Exit when the perspective plan is written

  - id: node-3000000000013
    type: workflow
    position:
      x: 550
      y: 420
    data:
      subtype: agent
      category: agent
      label: Relationships Lens
      config:
        agentId: goal-setter
        agentName: Relationships Perspective
        additionalPrompt: ""
        orchestratorInstructions: "You are the Relationships perspective lens. Using the identity file and think outputs provided in the trigger context, answer: If the ONLY goal were broader social connections and community, what would the plan look like for the requested time horizon? Follow Lens 4 from the goals-perspectives skill. Produce a single-perspective plan."
        successCriteria: A complete single-perspective plan from the relationships angle
        completionContract: Exit when the perspective plan is written

  - id: node-3000000000014
    type: workflow
    position:
      x: 700
      y: 420
    data:
      subtype: agent
      category: agent
      label: Business Lens
      config:
        agentId: goal-setter
        agentName: Business Perspective
        additionalPrompt: ""
        orchestratorInstructions: "You are the Business perspective lens. Using the identity file and think outputs provided in the trigger context, answer: If the ONLY goal were business growth and professional advancement, what would the plan look like for the requested time horizon? Follow Lens 5 from the goals-perspectives skill. Produce a single-perspective plan."
        successCriteria: A complete single-perspective plan from the business angle
        completionContract: Exit when the perspective plan is written

  - id: node-3000000000015
    type: workflow
    position:
      x: 850
      y: 420
    data:
      subtype: agent
      category: agent
      label: Purpose Lens
      config:
        agentId: goal-setter
        agentName: Purpose Perspective
        additionalPrompt: ""
        orchestratorInstructions: "You are the Purpose perspective lens. Using the identity file and think outputs provided in the trigger context, answer: If the ONLY goal were meaning, legacy, and fulfillment, what would the plan look like for the requested time horizon? Follow Lens 6 from the goals-perspectives skill. Produce a single-perspective plan."
        successCriteria: A complete single-perspective plan from the purpose angle
        completionContract: Exit when the perspective plan is written

  - id: node-3000000000016
    type: workflow
    position:
      x: 1000
      y: 420
    data:
      subtype: agent
      category: agent
      label: Growth Lens
      config:
        agentId: goal-setter
        agentName: Growth Perspective
        additionalPrompt: ""
        orchestratorInstructions: "You are the Growth perspective lens. Using the identity file and think outputs provided in the trigger context, answer: If the ONLY goal were personal development and capability building, what would the plan look like for the requested time horizon? Follow Lens 7 from the goals-perspectives skill. Produce a single-perspective plan."
        successCriteria: A complete single-perspective plan from the growth angle
        completionContract: Exit when the perspective plan is written

  # Merge all perspectives
  - id: node-3000000000020
    type: workflow
    position:
      x: 500
      y: 600
    data:
      subtype: merge
      category: flow-control
      label: Merge Perspectives
      config:
        strategy: wait-all

  # Synthesis agent
  - id: node-3000000000021
    type: workflow
    position:
      x: 500
      y: 740
    data:
      subtype: agent
      category: agent
      label: Harmonic Synthesis
      config:
        agentId: goal-setter
        agentName: Harmonic Synthesizer
        additionalPrompt: ""
        orchestratorInstructions: "You have received 7 perspective plans from the merge. Follow all three Synthesis prompts from the goals-perspectives skill in order: (1) Find Alignment, (2) Find Conflicts, (3) The Cohesive Goal. Produce a single unified plan for this time horizon built around the cohesive goal that serves the maximum number of perspectives."
        successCriteria: A unified plan with cohesive goal, alignment map, and resolved conflicts
        completionContract: Exit when the synthesized plan is complete

  # Critic loop — for-each over the 6 critic prompts
  - id: node-3000000000030
    type: workflow
    position:
      x: 500
      y: 880
    data:
      subtype: loop
      category: flow-control
      label: Critic Rounds
      config:
        loopMode: for-each
        maxIterations: 6
        condition: ""
        conditionMode: template

  - id: node-3000000000031
    type: workflow
    position:
      x: 500
      y: 1020
    data:
      subtype: orchestrator-prompt
      category: agent
      label: Inject Critic Prompt
      config:
        prompt: |-
          You are reviewing and improving a plan. Here is the current version of the plan:

          {{loop.currentItem.result}}

          Apply the following critique methodology to this plan. Be specific, brutal, and constructive. After your critique, rewrite the ENTIRE plan with improvements incorporated:

          {{loop.currentItem.label}}

  - id: node-3000000000032
    type: workflow
    position:
      x: 500
      y: 1160
    data:
      subtype: agent
      category: agent
      label: Critic
      config:
        agentId: goal-setter
        agentName: Plan Critic
        additionalPrompt: ""
        orchestratorInstructions: ""
        successCriteria: A rewritten plan that addresses the specific critique
        completionContract: Exit when the revised plan is complete

  # Response
  - id: node-3000000000040
    type: workflow
    position:
      x: 500
      y: 1340
    data:
      subtype: response
      category: io
      label: Refined Plan
      config:
        responseTemplate: Return the final refined plan after all critic rounds.

