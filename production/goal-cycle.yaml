      subtype: chat-app
      category: trigger
      label: Trigger
      config:
        triggerType: chat-app
        triggerDescription: Receives time horizon, domain, compressed inputs, and constraints from parent planner workflow

  - id: node-3000000000002
    type: workflow
    position:
      x: 500
      y: 120
    data:
      subtype: orchestrator-prompt
      category: agent
      label: Load Skill
      config:
        prompt: |-
          The trigger message tells you the time horizon and domain context.
          Determine the domain (human, business, world, or agent) from the trigger.

          Step 1: Call your file_search tool with query "goals-perspectives" to find the goals-perspectives skill file.
          Step 2: Use exec to read the full contents of the SKILL.md file found in step 1.
          Step 3: Return the complete skill content as your output. Do NOT summarize — return the full text.

  - id: node-3000000000003
    type: workflow
    position:
      x: 500
      y: 250
    data:
      subtype: parallel
      category: flow-control
      label: Launch Perspectives
      config: {}

  # 7 Perspective Lens Agents
  - id: node-3000000000010
    type: workflow
    position:
      x: 100
      y: 420
    data:
      subtype: agent
      category: agent
      label: Financial Lens
      config:
        agentId: goal-setter
        agentName: Financial Perspective
        additionalPrompt: ""
        orchestratorInstructions: "You are the Financial perspective lens. Using the identity file and think outputs provided in the trigger context, answer: If the ONLY goal were financial security and growth, what would the plan look like for the requested time horizon? Follow Lens 1 from the goals-perspectives skill. Produce a single-perspective plan."
        successCriteria: A complete single-perspective plan from the financial angle
        completionContract: Exit when the perspective plan is written

